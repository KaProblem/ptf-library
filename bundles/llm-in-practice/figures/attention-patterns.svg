<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 300" role="img" data-ptf-figure="1">
  <title>Encoder and decoder: who may look at whom</title>
  <desc>Two 6 × 6 grids for a sentence of 6 tokens; rows are the token that looks (query), columns the token looked at (key). Encoder: all 36 cells are allowed, every token sees every token, before and after it. Decoder: only the 21 cells on and below the diagonal are allowed, each token sees itself and the tokens before it. The mask is the only difference between the two.</desc>
  <g>
    <text class="t-s f-muted" x="170" y="16" text-anchor="middle">row = token that looks, column = token seen</text>
  </g>
  <g data-step="1" data-caption="Encoder: every token (row) may look at every token (column), before and after it. All 36 cells.">
