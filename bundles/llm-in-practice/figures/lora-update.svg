<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 326" role="img" data-ptf-figure="1">
  <title>LoRA: a frozen matrix and a thin trainable detour</title>
  <desc>The input x goes two ways. Upper path: the pretrained weight matrix W of size 4,096 × 4,096 (16.8 million numbers), frozen. Lower path: matrix A squeezes x to r = 8 numbers (8 × 4,096), matrix B expands them back to 4,096 (4,096 × 8); only A and B are trained, 65,536 numbers together, 0.39 % of W. Both paths are added: h = W x + (α / r) · B A x. B starts at zero, so at the start the output equals the pretrained W x.</desc>
  <defs><marker id="ptf-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="f-ink" d="M0 0 L10 5 L0 10 z"/></marker><marker id="ptf-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="f-accent" d="M0 0 L10 5 L0 10 z"/></marker></defs>
  <g>
    <rect class="f-surface s-ink w2" x="12" y="50" width="18" height="210" rx="3"/>
    <text class="t-l math bold" x="21" y="40" text-anchor="middle">x</text>
    <rect class="f-surface s-ink w2" x="306" y="50" width="18" height="210" rx="3"/>
    <text class="t-l math bold" x="315" y="40" text-anchor="middle">h</text>
  </g>
  <g data-step="1" data-caption="The pretrained matrix W (4,096 × 4,096, 16.8 million numbers) stays frozen.">
    <line class="s-ink w2" x1="30" y1="92" x2="66" y2="92" marker-end="url(#ptf-arrow-ink)"/>
    <rect class="f-surface s-muted w2" x="70" y="32" width="120" height="120" rx="3"/>
    <text class="t-l bold" x="130" y="88" text-anchor="middle">W</text>
    <text class="t-s f-muted" x="130" y="112" text-anchor="middle">frozen</text>
    <text class="t-s f-muted" x="130" y="134" text-anchor="middle">4,096 × 4,096</text>
    <line class="s-ink w2" x1="190" y1="92" x2="262" y2="150" marker-end="url(#ptf-arrow-ink)"/>
  </g>
  <g data-step="2" data-caption="A detour: A squeezes the input x down to r = 8 numbers (8 × 4,096).">
    <line class="s-ink w2" x1="30" y1="207" x2="66" y2="207" marker-end="url(#ptf-arrow-ink)"/>
    <polygon class="f-accent-soft s-accent w2" points="70,172 128,199 128,215 70,242"/>
    <text class="t-l bold f-accent" x="96" y="212" text-anchor="middle">A</text>
    <text class="t-s f-accent" x="98" y="268" text-anchor="middle">A: 8 × 4,096</text>
  </g>
  <g data-step="3" data-caption="B expands the 8 numbers back to 4,096 (4,096 × 8). Only A and B are trained: 65,536 numbers, 0.39 % of W.">
    <polygon class="f-accent-soft s-accent w2" points="150,199 208,172 208,242 150,215"/>
    <text class="t-l bold f-accent" x="182" y="212" text-anchor="middle">B</text>
    <line class="s-accent w2" x1="128" y1="207" x2="150" y2="207"/>
    <text class="t-s f-accent" x="139" y="190" text-anchor="middle">r = 8</text>
    <text class="t-s f-accent" x="190" y="288" text-anchor="middle">B: 4,096 × 8</text>
  </g>
  <g data-step="4" data-caption="Both paths are added: h = W x + (α / r) · B A x. B starts at zero, so training starts from the pretrained model.">
    <line class="s-accent w2" x1="208" y1="207" x2="262" y2="168" marker-end="url(#ptf-arrow-accent)"/>
    <text class="t-s f-accent math" x="250" y="214" text-anchor="middle">α / r</text>
    <circle class="f-surface s-ink w2" cx="275" cy="160" r="13"/>
    <text class="t-l bold" x="275" y="166" text-anchor="middle">+</text>
    <line class="s-ink w2" x1="288" y1="160" x2="302" y2="160" marker-end="url(#ptf-arrow-ink)"/>
    <text class="t math" x="168" y="314" text-anchor="middle">h = W x + (α / r) · B A x</text>
  </g>
</svg>
