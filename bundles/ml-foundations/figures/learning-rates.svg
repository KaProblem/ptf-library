  <title id="learning-rates-t">Three learning rates on the same loss valley</title>
  <desc id="learning-rates-d">Three copies of the loss curve L(w) = (w − 3)², each with gradient descent starting at w = 0. Top, α = 0.1: small steps 0, 0.6, 1.08, 1.46, 1.77, still far from the minimum at 3. Middle, α = 0.5: one step lands on w = 3. Bottom, α = 1.1: the steps overshoot and grow, 0, 6.6, −1.32, 8.18, so the loss rises and training diverges.</desc>
