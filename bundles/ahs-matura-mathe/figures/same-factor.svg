<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 320" role="img" aria-labelledby="same-factor-t same-factor-d" data-ptf-figure="1" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="same-factor-t">Exponential growth: the same factor for every step</title>
  <desc id="same-factor-d">Graph of f(x) = 2 · 1.5^x for x from 0 to 7, next to the line g(x) = 2 + 3x. From x = 1 to 2, f grows from 3 to 4.5; from x = 5 to 6, from 15.2 to 22.8. Both times the factor is 1.5, although the increase is much larger the second time. The line instead adds the same 3 for every step.</desc>
  <defs><marker id="ptf-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="f-ink" d="M0 0 L10 5 L0 10 z"/></marker><marker id="ptf-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="f-accent" d="M0 0 L10 5 L0 10 z"/></marker><marker id="ptf-arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="f-warn" d="M0 0 L10 5 L0 10 z"/></marker><marker id="ptf-arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="f-good" d="M0 0 L10 5 L0 10 z"/></marker></defs>
  <g>
    <line class="s-line" x1="40.0" y1="29.6" x2="40.0" y2="260"/>
    <text class="t-s f-muted" x="40.0" y="278" text-anchor="middle">0</text>
    <line class="s-line" x1="78.0" y1="29.6" x2="78.0" y2="260"/>
    <text class="t-s f-muted" x="78.0" y="278" text-anchor="middle">1</text>
    <line class="s-line" x1="116.0" y1="29.6" x2="116.0" y2="260"/>
    <text class="t-s f-muted" x="116.0" y="278" text-anchor="middle">2</text>
    <line class="s-line" x1="154.0" y1="29.6" x2="154.0" y2="260"/>
    <text class="t-s f-muted" x="154.0" y="278" text-anchor="middle">3</text>
    <line class="s-line" x1="192.0" y1="29.6" x2="192.0" y2="260"/>
    <text class="t-s f-muted" x="192.0" y="278" text-anchor="middle">4</text>
    <line class="s-line" x1="230.0" y1="29.6" x2="230.0" y2="260"/>
    <text class="t-s f-muted" x="230.0" y="278" text-anchor="middle">5</text>
    <line class="s-line" x1="268.0" y1="29.6" x2="268.0" y2="260"/>
    <text class="t-s f-muted" x="268.0" y="278" text-anchor="middle">6</text>
    <line class="s-line" x1="306.0" y1="29.6" x2="306.0" y2="260"/>
    <text class="t-s f-muted" x="306.0" y="278" text-anchor="middle">7</text>
    <line class="s-line" x1="40" y1="260.0" x2="306.0" y2="260.0"/>
    <text class="t-s f-muted" x="34" y="265.0" text-anchor="end">0</text>
    <line class="s-line" x1="40" y1="196.0" x2="306.0" y2="196.0"/>
    <text class="t-s f-muted" x="34" y="201.0" text-anchor="end">10</text>
    <line class="s-line" x1="40" y1="132.0" x2="306.0" y2="132.0"/>
    <text class="t-s f-muted" x="34" y="137.0" text-anchor="end">20</text>
    <line class="s-line" x1="40" y1="68.0" x2="306.0" y2="68.0"/>
    <text class="t-s f-muted" x="34" y="73.0" text-anchor="end">30</text>
    <line class="s-ink w2" x1="40" y1="260" x2="321.2" y2="260" marker-end="url(#ptf-arrow-ink)"/>
    <line class="s-ink w2" x1="40" y1="260" x2="40" y2="16.8" marker-end="url(#ptf-arrow-ink)"/>
    <text class="t-s f-ink math" x="321.2" y="252" text-anchor="end">x</text>
  </g>
  <g data-step="1" data-caption="The curve f(x) = 2 · 1.5^x starts at 2 and gets steeper and steeper.">
    <polyline class="s-accent w3" points="40.0,247.2 43.8,246.7 47.6,246.1 51.4,245.5 55.2,244.9 59.0,244.3 62.8,243.7 66.6,243.0 70.4,242.3 74.2,241.6 78.0,240.8 81.8,240.0 85.6,239.2 89.4,238.3 93.2,237.4 97.0,236.5 100.8,235.5 104.6,234.5 108.4,233.4 112.2,232.3 116.0,231.2 119.8,230.0 123.6,228.8 127.4,227.5 131.2,226.1 135.0,224.7 138.8,223.3 142.6,221.7 146.4,220.2 150.2,218.5 154.0,216.8 157.8,215.0 161.6,213.2 165.4,211.2 169.2,209.2 173.0,207.1 176.8,204.9 180.6,202.6 184.4,200.2 188.2,197.8 192.0,195.2 195.8,192.5 199.6,189.7 203.4,186.8 207.2,183.8 211.0,180.6 214.8,177.4 218.6,173.9 222.4,170.4 226.2,166.7 230.0,162.8 233.8,158.8 237.6,154.6 241.4,150.2 245.2,145.7 249.0,141.0 252.8,136.0 256.6,130.9 260.4,125.6 264.2,120.0 268.0,114.2 271.8,108.2 275.6,101.9 279.4,95.3 283.2,88.5 287.0,81.4 290.8,74.0 294.6,66.3 298.4,58.3 302.2,50.0 306.0,41.3"/>
    <text class="t f-accent math" x="51.4" y="61.6">f(x) = 2 · 1.5<tspan class="t-s" dy="-7">x</tspan><tspan dy="7"> </tspan></text>
  </g>
  <g data-step="2" data-caption="One step from x = 1 to x = 2: 3 becomes 4.5, that is × 1.5.">
    <circle class="f-warn" cx="78.0" cy="240.8" r="5"/>
    <circle class="f-warn" cx="116.0" cy="231.2" r="5"/>
    <path class="s-warn w2 dash" d="M78.0 240.8 H116.0 V231.2"/>
    <text class="t-s f-warn" x="124.0" y="247.2">3 → 4.5  (× 1.5)</text>
  </g>
  <g data-step="3" data-caption="One step from x = 5 to x = 6: 15.2 becomes 22.8, again × 1.5.">
    <circle class="f-good" cx="230.0" cy="162.8" r="5"/>
    <circle class="f-good" cx="268.0" cy="114.2" r="5"/>
    <path class="s-good w2 dash" d="M230.0 162.8 H268.0 V114.2"/>
    <text class="t-s f-good" x="222.0" y="152.8" text-anchor="end">15.2 → 22.8  (× 1.5)</text>
  </g>
  <g data-step="4" data-caption="Compare the line g(x) = 2 + 3x: it adds 3 per step, the curve multiplies by 1.5.">
    <line class="s-muted w2 dash" x1="40.0" y1="247.2" x2="306.0" y2="112.8"/>
    <text class="t-s f-muted math" x="131.2" y="176.8" text-anchor="end">g(x) = 2 + 3x</text>
    <text class="t f-ink" x="40" y="306">f(x + 1) = 1.5 · f(x)</text>
  </g>
</svg>
