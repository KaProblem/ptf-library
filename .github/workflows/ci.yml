name: CI
on:
  push:
    branches: [main]
  pull_request:
# Every tool is pinned, so a run only changes when this file changes.
# Bump PTF_SPEC_REF to a newer ptf-spec commit on purpose, and the versions below with it.
env:
  PTF_SPEC_REF: 8ff5e7b1b0fe1aed743312af218939df8171e66a
  PLAYWRIGHT_VERSION: 1.63.0
  TORCH_VERSION: 2.5.1
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check out ptf-spec (tools and schemas)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: KaProblem/ptf-spec
          ref: ${{ env.PTF_SPEC_REF }}
          path: .ptf-spec
          # Needed while ptf-spec is private: a fine-grained token with read access to it.
          token: ${{ secrets.PTF_SPEC_TOKEN || github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
      - run: npm ci --prefix .ptf-spec
      - name: Validate library
        run: node .ptf-spec/tools/ptf-check.mjs .
      - name: Verify Wikidata subject anchors
        run: node .ptf-spec/tools/ptf-wikidata.mjs verify .
      - name: Simulator self-tests
        run: |
          npm install --no-save --prefix .ptf-spec "playwright@$PLAYWRIGHT_VERSION"
          npx --prefix .ptf-spec playwright install --with-deps chromium
          node .ptf-spec/tools/ptf-selftest.mjs sims/*/*/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.8"
      - name: Code lab smoke tests
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==$TORCH_VERSION"
          node .ptf-spec/tools/ptf-codetest.mjs code/*/*/
