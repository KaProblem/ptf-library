<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 356" role="img" aria-labelledby="tiny-network-t tiny-network-d" data-ptf-figure="1">
  <title id="tiny-network-t">Forward pass through a tiny network</title>
  <desc id="tiny-network-d">A network with inputs x₁ and x₂, two hidden ReLU nodes h₁ and h₂ and one output y′. Weights into h₁: 1 from x₁, 1 from x₂, bias 0. Weights into h₂: −1 from x₁, 2 from x₂, bias 1. Weights into y′: 3 from h₁, 2 from h₂, bias −1. With x = (2, −1): h₁ = ReLU(1) = 1, h₂ = ReLU(−3) = 0, y′ = 3 · 1 + 2 · 0 − 1 = 2.</desc>
  <defs><marker id="ptf-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="f-ink" d="M0 0 L10 5 L0 10 z"/></marker><marker id="ptf-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="f-muted" d="M0 0 L10 5 L0 10 z"/></marker><marker id="ptf-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="f-accent" d="M0 0 L10 5 L0 10 z"/></marker><marker id="ptf-arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="f-warn" d="M0 0 L10 5 L0 10 z"/></marker><marker id="ptf-arrow-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="f-good" d="M0 0 L10 5 L0 10 z"/></marker></defs>
  <g>
    <line class="s-muted w2" x1="70.0" y1="86.0" x2="144.0" y2="86.0" marker-end="url(#ptf-arrow-muted)"/>
    <line class="s-muted w2" x1="61.9" y1="104.0" x2="152.8" y2="206.5" marker-end="url(#ptf-arrow-muted)"/>
    <line class="s-muted w2" x1="61.9" y1="208.0" x2="152.8" y2="105.5" marker-end="url(#ptf-arrow-muted)"/>
    <line class="s-muted w2" x1="70.0" y1="226.0" x2="144.0" y2="226.0" marker-end="url(#ptf-arrow-muted)"/>
    <line class="s-muted w2" x1="190.9" y1="97.8" x2="271.4" y2="143.2" marker-end="url(#ptf-arrow-muted)"/>
    <line class="s-muted w2" x1="190.9" y1="214.2" x2="271.4" y2="168.8" marker-end="url(#ptf-arrow-muted)"/>
    <circle class="f-surface s-ink w2" cx="46.0" cy="86.0" r="24"/>
    <text class="t f-ink math" x="46.0" y="92.0" text-anchor="middle">x₁</text>
    <circle class="f-surface s-ink w2" cx="46.0" cy="226.0" r="24"/>
    <text class="t f-ink math" x="46.0" y="232.0" text-anchor="middle">x₂</text>
    <circle class="f-accent-soft s-accent w2" cx="170.0" cy="86.0" r="24"/>
    <text class="t f-ink math" x="170.0" y="92.0" text-anchor="middle">h₁</text>
    <circle class="f-accent-soft s-accent w2" cx="170.0" cy="226.0" r="24"/>
    <text class="t f-ink math" x="170.0" y="232.0" text-anchor="middle">h₂</text>
    <circle class="f-surface s-ink w2" cx="294.0" cy="156.0" r="24"/>
    <text class="t f-ink math" x="294.0" y="162.0" text-anchor="middle">y′</text>
    <text class="t-s f-muted" x="46.0" y="30.0" text-anchor="middle">input</text>
    <text class="t-s f-muted" x="170.0" y="30.0" text-anchor="middle">hidden (ReLU)</text>
    <text class="t-s f-muted" x="294.0" y="30.0" text-anchor="middle">output</text>
  </g>
  <g data-step="1" data-caption="Two inputs, two hidden nodes with ReLU, one output. Each arrow carries a weight; each node adds its bias.">
    <text class="t-s f-accent bold" x="104.0" y="74.0" text-anchor="middle">1</text>
    <text class="t-s f-accent bold" x="84.0" y="128.0" text-anchor="middle">−1</text>
    <text class="t-s f-accent bold" x="84.0" y="196.0" text-anchor="middle">1</text>
    <text class="t-s f-accent bold" x="104.0" y="244.0" text-anchor="middle">2</text>
    <text class="t-s f-muted" x="170.0" y="124.0" text-anchor="middle">b = 0</text>
    <text class="t-s f-muted" x="170.0" y="266.0" text-anchor="middle">b = 1</text>
    <text class="t-s f-accent bold" x="240.0" y="108.0" text-anchor="middle">3</text>
    <text class="t-s f-accent bold" x="240.0" y="214.0" text-anchor="middle">2</text>
    <text class="t-s f-muted" x="294.0" y="196.0" text-anchor="middle">b = −1</text>
  </g>
  <g data-step="2" data-caption="Inputs x₁ = 2, x₂ = −1. Hidden node 1: 1·2 + 1·(−1) + 0 = 1, ReLU keeps 1. Hidden node 2: −1·2 + 2·(−1) + 1 = −3, ReLU turns it into 0.">
    <text class="t bold f-warn" x="10.0" y="92.0">2</text>
    <text class="t bold f-warn" x="4.0" y="232.0">−1</text>
    <text class="t-s f-ink" x="170.0" y="292.0" text-anchor="middle">h₁ = ReLU(1·2 + 1·(−1) + 0) = 1</text>
    <text class="t-s f-ink" x="170.0" y="312.0" text-anchor="middle">h₂ = ReLU(−1·2 + 2·(−1) + 1) = ReLU(−3) = 0</text>
  </g>
  <g data-step="3" data-caption="Output: 3·h₁ + 2·h₂ − 1 = 3·1 + 2·0 − 1 = 2.">
    <text class="t f-good bold" x="170.0" y="340.0" text-anchor="middle">y′ = 3·1 + 2·0 − 1 = 2</text>
  </g>
</svg>
