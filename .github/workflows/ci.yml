name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out ptf-spec (tools and schemas)
        uses: actions/checkout@v4
        with:
          repository: KaProblem/ptf-spec
          path: .ptf-spec
          # Needed while ptf-spec is private: a fine-grained token with read access to it.
          token: ${{ secrets.PTF_SPEC_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix .ptf-spec
      - name: Validate library
        run: node .ptf-spec/tools/ptf-check.mjs .
      - name: Verify Wikidata subject anchors
        run: |
          if [ ! -f .ptf-spec/tools/ptf-wikidata.mjs ]; then
            echo "::warning::ptf-spec main has no ptf-wikidata.mjs yet; skipping the Wikidata check"
            exit 0
          fi
          node .ptf-spec/tools/ptf-wikidata.mjs verify .
      - name: Simulator self-tests
        run: |
          npm install --no-save --prefix .ptf-spec playwright
          npx --prefix .ptf-spec playwright install --with-deps chromium
          node .ptf-spec/tools/ptf-selftest.mjs sims/*/*/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Code lab smoke tests
        run: |
          if [ ! -f .ptf-spec/tools/ptf-codetest.mjs ]; then
            echo "::warning::ptf-spec main has no ptf-codetest.mjs yet (added in KaProblem/ptf-spec#3); skipping code lab smoke tests"
            exit 0
          fi
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.1"
          node .ptf-spec/tools/ptf-codetest.mjs code/*/*/
